<!--
  Webflow: crear una página en blanco con slug "datasheet".
  La URL queda https://www.macroled.com.ar/datasheet?sku=EL-SKU
  Pegar este bloque en un Embed de esa página. No hace falta otro script en el Head.
  Al abrir el enlace, esta página vuelve a armar el PDF. Por eso funciona en incógnito.
-->
<style>
  .ml-datasheet { margin: 0; min-height: 100vh; background: #525659; color: #fff; font-family: "Segoe UI", sans-serif; }
  .ml-datasheet .status { margin: 0; padding: 28px 24px; font-size: 16px; }
  .ml-datasheet iframe { border: 0; display: block; width: 100%; height: 100vh; background: #525659; }
</style>
<div class="ml-datasheet">
  <p class="status" id="ml-datasheet-status">Generando ficha…</p>
</div>
<script>window.__mlSkipFichaBoot = true;</script>
<script src="https://cdn.jsdelivr.net/gh/julietaromano-wq/macroled@4bf32c6/ficha/script.js"></script>
<script>
(function () {
  function skuFromLocation() {
    var fromQuery = (new URLSearchParams(location.search).get("sku") || "").trim();
    if (fromQuery) return fromQuery;
    var parts = location.pathname.split("/").filter(Boolean);
    var at = parts.lastIndexOf("datasheet");
    var next = at >= 0 ? parts[at + 1] : "";
    if (next && next.toLowerCase() !== "index.html") {
      try { return decodeURIComponent(next); } catch (err) { return next; }
    }
    return "";
  }

  var root = document.querySelector(".ml-datasheet");
  var status = document.getElementById("ml-datasheet-status");
  var sku = skuFromLocation();
  if (!sku) {
    status.textContent = "Falta el SKU de la ficha.";
    return;
  }
  document.title = sku + " — Ficha técnica";
  var open = window.MacroledSheet && window.MacroledSheet.view;
  if (typeof open !== "function") {
    status.textContent = "No pudimos cargar el generador de la ficha.";
    return;
  }
  open(sku).then(function (url) {
    status.remove();
    var frame = document.createElement("iframe");
    frame.title = "Ficha técnica " + sku;
    frame.src = url;
    root.appendChild(frame);
  }).catch(function () {
    status.textContent = "No pudimos armar la ficha de " + sku + ".";
  });
})();
</script>
