<!--
  ===========================================================================
  VARIANTES — Collection List atada a Variantes_Multireference
  ===========================================================================

  POR QUÉ HACE FALTA
  Un campo multi-reference NO se puede imprimir como texto dentro de un Embed:
  el selector de campos del Embed solo ofrece texto plano, número, link, switch,
  opción, etc. La única forma de sacarlo al HTML es con una Collection List
  conectada al campo.

  script.js arma los chips leyendo un .cms-product-item por cada variante. Si en
  la página solo existe el del producto actual, el bloque se oculta solo. Esto es
  lo que faltaba.

  ---------------------------------------------------------------------------
  PASOS EN EL DESIGNER (plantilla de producto)
  ---------------------------------------------------------------------------
  1. Agregá un Collection List Wrapper en cualquier parte de la plantilla
     (conviene abajo de todo, al lado del embed del héroe).
  2. En Settings del wrapper → Source: elegí "Variantes_Multireference".
     OJO: elegí el CAMPO, no la colección Productos. Si conectás la colección
     te trae los 100 productos en vez de las variantes de este item.
  3. Ponele al wrapper la clase  cms-variants-source  (styles.css ya la oculta).
  4. Adentro del Collection Item, agregá un Embed y pegá el bloque de abajo.
  5. Reemplazá cada  ((CAMPO))  usando el botón "+ Add Field" del Embed. No
     copies tokens a mano: adentro de la lista el picker apunta a los campos de
     la VARIANTE, que es justo lo que necesitamos.
  6. En el embed del héroe (cms-source-embed.html) agregá el atributo data-hero.
     Sirve para que el script sepa cuál de todos los .cms-product-item es el
     producto de la página, sin depender del orden de montaje.

  ---------------------------------------------------------------------------
  QUÉ MIRAR DESPUÉS DE PUBLICAR
  ---------------------------------------------------------------------------
  Abrí la consola del navegador. script.js loguea:

    [variantes] { hero, hermanas, skus, atributoDeclarado, dimension }

  - hermanas: 1  → la Collection List no está renderizando (revisá el paso 2).
  - dimension: "(fallback por nombre/SKU)" → las variantes se encontraron pero
    ningún campo de specs las diferencia. Los chips igual aparecen, etiquetados
    por nombre. Para que digan "Blanco / Negro / Platil" hay que cargar el campo
    correspondiente (COLOR, TEMPERATURA COLOR, ANGULO DE APERTURA, etc.) en cada
    variante del CMS.

  LÍMITES: hasta 100 items por lista anidada y 10 listas anidadas por página.
  Alcanza de sobra: el grupo más grande del catálogo tiene 4 variantes.
-->
