  <a class="back-link" id="backLink" href="../productos/">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    <span id="backLinkText">Volver a productos</span>
  </a>

  <div class="page-head">
    <div class="page-head-copy">
      <h1>Comparar productos</h1>
      <div class="count" id="countLabel">Cargando…</div>
    </div>
    <button class="print-btn" id="printBtn" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Imprimir comparación
    </button>
    <button class="share-btn" id="shareBtn" type="button" hidden>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
      Compartir
    </button>
  </div>

  <div class="diff-bar" id="diffBar">
    <label class="diff-bar-toggle" id="diffFloatToggle">
      <span>Mostrar solo diferencias</span>
      <span class="switch" id="diffFloatSwitch"><span class="knob"></span></span>
    </label>
  </div>

  <div class="swipe-hint" id="swipeHint" role="status" aria-live="polite">
    <span class="swipe-hint__icons" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </span>
    <span>Deslizá hacia la derecha para ver los demás productos</span>
  </div>

  <div class="compare-shell-wrap" id="compareShellWrap">
  <div class="compare-shell" id="compareShell">
    <div class="compare-grid" id="compareGrid" aria-busy="true"></div>
    <script>
      (function(){
        var head = '<div class="cell product-head coldata compare-skel-cell" aria-hidden="true">'
          + '<span class="skel skel-thumb"></span>'
          + '<span class="skel skel-pname"></span>'
          + '<span class="skel skel-sku"></span>'
          + '<span class="skel skel-select"></span>'
          + '<div class="phead-btns"><span class="skel skel-btn"></span></div>'
          + '</div>';
        var row = '<div class="cell label label-full compare-skel-cell" aria-hidden="true"><span class="skel skel-label"></span></div>'
          + '<div class="cell value coldata compare-skel-cell" aria-hidden="true"><span class="skel skel-value"></span></div>'
          + '<div class="cell value coldata compare-skel-cell" aria-hidden="true"><span class="skel skel-value"></span></div>'
          + '<div class="cell value coldata compare-skel-cell" aria-hidden="true"><span class="skel skel-value"></span></div>';
        var section = '<div class="cell section compare-skel-cell" aria-hidden="true"><span class="skel skel-section"></span></div>';
        // Cantidad de filas por sección aproxima cuántas specs suelen tener
        // dato real (SPEC_SCHEMA en app.js llega a 34 filas posibles, pero
        // muchas quedan vacías según el producto). Un esqueleto de solo 6
        // filas quedaba muy por debajo de la altura real: al llegar los
        // datos de Typesense, #compareGrid crecía de golpe y empujaba todo
        // lo de abajo (.footer-wrap) — eso es el layout shift que mostraba
        // el reporte de Web Vitals. Con más secciones/filas acá, la altura
        // reservada queda mucho más cerca de la real y el salto se reduce.
        var html = '<div class="cell label compare-skel-cell" aria-hidden="true"></div>'
          + head + head + head
          + section + row.repeat(6)
          + section + row.repeat(5)
          + section + row.repeat(5)
          + section + row.repeat(2);
        document.getElementById("compareGrid").innerHTML = html;
      })();
    </script>
  </div>
    <div class="scroll-fade" id="scrollFade"></div>
  </div></div>

<div class="share-toast" id="shareToast">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="shareToastText">Enlace copiado</span>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <div class="modal-head">
      <h3>Buscar producto para comparar</h3>
      <button class="close" id="modalClose">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-search">
      <input type="text" id="modalSearchInput" placeholder="Buscar por nombre, SKU o descripción…">
    </div>
    <div class="modal-list" id="modalList"></div>
    <div class="modal-foot"><a id="viewAllLink">Ver todos los productos →</a></div>
  </div>
</div>

<button type="button" class="ai-launch is-visible" id="aiLaunch" aria-label="Asistente" aria-haspopup="dialog" aria-controls="aiPanel" onclick="if(window.MacroledAssistantOpen){window.MacroledAssistantOpen(this);return false;}">
  <span class="ai-launch-dot" aria-hidden="true"></span>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3a7 7 0 0 0-4 12.7V19l4-2 4 2v-3.3A7 7 0 0 0 12 3z"/><path d="M9.5 10h.01M14.5 10h.01"/></svg>
  <span>Asistente</span>
</button>

<div class="ai-backdrop" id="aiBackdrop" hidden></div>
<aside class="ai-panel" id="aiPanel" role="dialog" aria-modal="true" aria-labelledby="aiTitle" hidden>
  <div class="ai-head">
    <div class="ai-head-main">
      <div class="ai-avatar" aria-hidden="true">
        <svg class="ai-avatar-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3a7 7 0 0 0-4 12.7V19l4-2 4 2v-3.3A7 7 0 0 0 12 3z"/><path d="M9.5 10h.01M14.5 10h.01"/></svg>
        <span class="ai-avatar-online"></span>
      </div>
      <div class="ai-head-copy">
        <h2 id="aiTitle">Asistente de producto</h2>
        <p class="ai-head-sub">Estamos para ayudarte</p>
      </div>
    </div>
    <button type="button" class="ai-close" id="aiClose" aria-label="Cerrar asistente">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="ai-messages" id="aiMessages" aria-live="polite"></div>
  <div class="ai-typing" id="aiTyping" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="ai-suggestions" id="aiSuggestions"></div>
  <form class="ai-form" id="aiForm">
    <input type="text" id="aiInput" placeholder="Buscá un producto, SKU o característica…" autocomplete="off" aria-label="Pregunta">
    <button type="submit" class="ai-send" aria-label="Enviar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
</aside>
<script src="comparar.js"></script>
<script src="app.js"></script>
</body>
</html>
