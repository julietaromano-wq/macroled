<div class="mlg-newsletter-backdrop" id="mlgNewsletterBackdrop" hidden></div>
<div class="mlg-newsletter-popup" id="mlgNewsletterPopup" role="dialog" aria-modal="true" aria-labelledby="mlgNewsletterTitle" hidden>
  <button type="button" class="mlg-newsletter-close" id="mlgNewsletterClose" aria-label="Cerrar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="mlg-newsletter-popup__icon" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="2"/>
      <path d="M3 7l9 7 9-7"/>
    </svg>
  </div>
  <h2 id="mlgNewsletterTitle">Sumate a nuestro newsletter</h2>
  <p class="mlg-newsletter-popup__sub">Completá tus datos para recibir contenido exclusivo y lanzamientos.</p>
  <form id="mlgNewsletterForm" class="mlg-newsletter-form" data-newsletter-endpoint="https://n8n.coresagroup.com/webhook/newsletter-macroled" novalidate>
    <!-- <div class="mlg-newsletter-field">
      <div class="mlg-newsletter-pill">
        <label class="mlg-newsletter-border-label" for="mlg-newsletter-nombre">Nombre</label>
        <input id="mlg-newsletter-nombre" type="text" name="nombre" placeholder="Tu nombre" required autocomplete="name">
      </div>
    </div> -->
    <div class="mlg-newsletter-field">
      <div class="mlg-newsletter-pill">
        <label class="mlg-newsletter-border-label" for="mlg-newsletter-email">Email</label>
        <input id="mlg-newsletter-email" type="email" name="email" placeholder="tu@email.com" required autocomplete="email">
      </div>
    </div>
    <div class="mlg-newsletter-field mlg-newsletter-field--interests">
      <p class="mlg-newsletter-interests-label" id="mlg-newsletter-interes-label">Área de interés</p>
      <div class="mlg-newsletter-interest-tabs" role="group" aria-labelledby="mlg-newsletter-interes-label" data-interest-tabs>
        <button type="button" class="mlg-newsletter-interest-tab" data-interest="residencial" aria-pressed="false">Residencial</button>
        <button type="button" class="mlg-newsletter-interest-tab" data-interest="proyectos" aria-pressed="false">Obras y proyectos</button>
        <button type="button" class="mlg-newsletter-interest-tab" data-interest="arquitectura" aria-pressed="false">Arquitectura</button>
      </div>
    </div>
    <!-- <div class="mlg-newsletter-consent">
      <input type="checkbox" id="mlg-newsletter-acepta" name="acepta_newsletter" value="true" required>
      <label for="mlg-newsletter-acepta">Acepto recibir el Newsletter Macroled. Puedo darme de baja cuando quiera.</label>
    </div> -->
    <p class="mlg-newsletter-error" id="mlgNewsletterError" role="alert" hidden></p>
    <button type="submit" class="mlg-newsletter-submit">Suscribirme</button>
    <p class="mlg-newsletter-popup__note">Podés darte de baja cuando quieras.</p>
  </form>
  <div class="mlg-newsletter-success" id="mlgNewsletterSuccess" hidden>
    <p class="mlg-newsletter-success__title">¡Listo, ya estás suscripto!</p>
    <p>Te vamos a contar novedades, lanzamientos y contenido exclusivo.</p>
  </div>
</div>
